<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Electrónica con Arduino</title>

<!-- FUENTE PRO -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0b0b0f;
    --card:#111118;
    --primary:#7c3aed;
    --secondary:#3b82f6;
    --text:#f1f5f9;
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
}

/* ===== FONDO SUAVE ===== */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background: radial-gradient(circle at 20% 30%, rgba(124,58,237,.2), transparent),
                radial-gradient(circle at 80% 70%, rgba(59,130,246,.2), transparent);
    z-index:-1;
}

/* ===== PORTADA ===== */
.portada{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:2rem;
}

.titulo{
    font-size: clamp(2.5rem,6vw,4rem);
    font-weight:800;
    margin-bottom:1.5rem;
}

.sub{
    opacity:.7;
    margin-bottom:2rem;
}

/* EQUIPO */
.equipo{
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,.05);
    padding:1.5rem;
    border-radius:16px;
    width:100%;
    max-width:500px;
}

.miembro{
    padding:.7rem;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.miembro:last-child{border:none;}

/* ===== CATALOGO ===== */
.catalogo{
    padding:4rem 2rem;
}

.catalogo h2{
    text-align:center;
    font-size:2.3rem;
    margin-bottom:3rem;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:2rem;
    max-width:1200px;
    margin:auto;
}

/* ===== CARD PRO ===== */
.card{
    background:var(--card);
    border-radius:18px;
    overflow:hidden;
    transition:.4s;
    transform-style:preserve-3d;
}

.card:hover{
    transform: translateY(-8px) scale(1.02);
    box-shadow:0 20px 50px rgba(124,58,237,.3);
}

/* IMAGEN */
.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

/* CONTENIDO */
.card-content{
    padding:1.2rem;
}

.card-title{
    font-size:1.2rem;
    margin-bottom:.5rem;
}

/* BOTÓN PRO */
.btn{
    display:inline-block;
    margin-top:.5rem;
    padding:.6rem 1.2rem;
    border-radius:10px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:white;
    text-decoration:none;
    font-size:.9rem;
    transition:.3s;
}

.btn:hover{
    transform: scale(1.05);
    box-shadow:0 0 15px rgba(124,58,237,.6);
}

/* NUMERO */
.numero{
    position:absolute;
    top:10px;
    right:10px;
    background:var(--primary);
    width:35px;
    height:35px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

/* ===== ANIMACIÓN SCROLL ===== */
.hidden{
    opacity:0;
    transform: translateY(30px);
    transition:all .6s ease;
}

.show{
    opacity:1;
    transform: translateY(0);
}
</style>
</head>

<body>

<!-- PORTADA -->
<section class="portada hidden">
    <h1 class="titulo">Electrónica con Arduino</h1>
    <p class="sub">Proyecto interactivo de aprendizaje</p>

    <div class="equipo">
        <div class="miembro">David Yael Gutiérrez Moguel</div>
        <div class="miembro">Alde Elishua Ruiz Pérez</div>
        <div class="miembro">Valeria Michell Velasco Maza</div>
        <div class="miembro">Ervin Alexander Gonzales Meneces</div>
    </div>
</section>

<!-- CATALOGO -->
<section class="catalogo">
    <h2 class="hidden">Catálogo de Temas</h2>

    <div class="grid">

        <div class="card hidden">
            <img src="https://images.unsplash.com/photo-1553406830-ef2513450d76">
            <div class="card-content">
                <h3 class="card-title">Conceptos Básicos</h3>
                <a href="conceptos-basicos.html" class="btn">Explorar</a>
            </div>
        </div>

        <div class="card hidden">
            <img src="https://images.unsplash.com/photo-1581092160562-40aa08e78837">
            <div class="card-content">
                <h3 class="card-title">Materiales</h3>
                <a href="materiales-arduino.html" class="btn">Explorar</a>
            </div>
        </div>

        <div class="card hidden">
            <img src="https://images.unsplash.com/photo-1581092160562-40aa08e78837">
            <div class="card-content">
                <h3 class="card-title">Circuitos</h3>
                <a href="circuitos-serie-paralelo.html" class="btn">Explorar</a>
            </div>
        </div>

    </div>
</section>

<!-- JS PRO -->
<script>
// SCROLL REVEAL
const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }
    });
});

document.querySelectorAll(".hidden").forEach(el=>observer.observe(el));

// HOVER 3D SUAVE
document.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("mousemove",(e)=>{
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const rotateX = (y - rect.height/2)/20;
        const rotateY = (rect.width/2 - x)/20;

        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
    });

    card.addEventListener("mouseleave",()=>{
        card.style.transform="rotateX(0) rotateY(0) scale(1)";
    });
});
</script>

</body>
</html>
