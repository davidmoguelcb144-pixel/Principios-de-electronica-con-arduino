<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Electrónica con Arduino</title>

<style>
/* ===== VARIABLES ===== */
:root{
    --bg: #0a0a0a;
    --primary: #7c3aed;
    --secondary: #3b82f6;
    --accent: #ec4899;
    --text: #ffffff;
    --glass: rgba(255,255,255,0.08);
}

/* ===== RESET ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* ===== PORTADA ===== */
.portada{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;

    background: linear-gradient(-45deg,
        #667eea,
        #764ba2,
        #f093fb,
        #4facfe
    );
    background-size:400% 400%;
    animation: fondo 10s ease infinite;
}

@keyframes fondo{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* ===== TITULO ===== */
.titulo{
    font-size: clamp(2.5rem, 7vw, 4.5rem);
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 2rem;

    text-shadow:0 0 15px rgba(255,255,255,.7);
}

/* ===== EQUIPO ===== */
.equipo{
    max-width:600px;
}

.equipo h2{
    margin-bottom:1rem;
    color:#fff;
}

.miembro{
    background: var(--glass);
    margin:.5rem 0;
    padding:1rem;
    border-radius:12px;
    transition:.3s;
}

.miembro:hover{
    transform: translateY(-3px);
    background: rgba(255,255,255,0.15);
}

/* ===== CATALOGO ===== */
.catalogo{
    padding:4rem 2rem;
}

.catalogo h2{
    text-align:center;
    font-size:2.5rem;
    margin-bottom:3rem;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:2rem;
}

/* ===== CARD ===== */
.card{
    background:#111;
    border-radius:18px;
    overflow:hidden;
    transition:.4s;
    position:relative;
}

.card:hover{
    transform: translateY(-8px) scale(1.02);
    box-shadow:0 15px 40px rgba(124,58,237,.5);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-content{
    padding:1.2rem;
}

.card-title{
    font-size:1.3rem;
    margin-bottom:.5rem;
}

/* BOTÓN */
.btn{
    display:inline-block;
    margin-top:.5rem;
    padding:.5rem 1rem;
    border-radius:8px;
    background: linear-gradient(135deg,var(--primary),var(--secondary));
    color:white;
    text-decoration:none;
    font-size:.9rem;
    transition:.3s;
}

.btn:hover{
    opacity:.8;
}

/* NUMERO */
.numero{
    position:absolute;
    top:10px;
    right:10px;
    background:var(--primary);
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

/* RESPONSIVE */
@media(max-width:600px){
    .titulo{
        font-size:2rem;
    }
}
</style>
</head>

<body>

<!-- ===== PORTADA ===== -->
<section class="portada">
    <h1 class="titulo">Electrónica con Arduino</h1>

    <div class="equipo">
        <h2>Equipo:</h2>
        <div class="miembro">1. David Yael Gutiérrez Moguel</div>
        <div class="miembro">2. Alde Elishua Ruiz Pérez</div>
        <div class="miembro">3. Valeria Michell Velasco Maza</div>
        <div class="miembro">4. Ervin Alexander Gonzales Meneces</div>
    </div>
</section>

<!-- ===== CATALOGO ===== -->
<section class="catalogo">
    <h2>Catálogo de Temas</h2>

    <div class="grid">

        <div class="card">
            <div class="numero">1</div>
            <img src="https://images.unsplash.com/photo-1553406830-ef2513450d76">
            <div class="card-content">
                <h3 class="card-title">Conceptos Básicos</h3>
                <a href="conceptos-basicos.html" class="btn">Ver tema</a>
            </div>
        </div>

        <div class="card">
            <div class="numero">2</div>
            <img src="https://images.unsplash.com/photo-1581092160562-40aa08e78837">
            <div class="card-content">
                <h3 class="card-title">Materiales</h3>
                <a href="materiales-arduino.html" class="btn">Ver tema</a>
            </div>
        </div>

        <div class="card">
            <div class="numero">3</div>
            <img src="https://images.unsplash.com/photo-1581092160562-40aa08e78837">
            <div class="card-content">
                <h3 class="card-title">Circuitos Serie y Paralelo</h3>
                <a href="circuitos-serie-paralelo.html" class="btn">Ver tema</a>
            </div>
        </div>

    </div>
</section>

</body>
</html>
