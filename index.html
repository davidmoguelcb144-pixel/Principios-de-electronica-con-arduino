<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arduino Dinámico</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0b0b0f;
    --primary:#7c3aed;
    --secondary:#3b82f6;
    --text:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
    cursor:none; /* ocultamos cursor */
}

/* ===== CURSOR PRO ===== */
.cursor{
    width:20px;
    height:20px;
    border:2px solid white;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:999;
    transition:transform .1s;
}

/* ===== PARTÍCULAS ===== */
canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

/* ===== PORTADA ===== */
.portada{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.titulo{
    font-size:clamp(2.5rem,6vw,4rem);
    font-weight:900;
}

/* ===== CARDS ===== */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:2rem;
    padding:4rem;
}

.card{
    background:#111;
    border-radius:15px;
    overflow:hidden;
    transition:.2s;
    transform-style:preserve-3d;
    position:relative;
}

.card::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at var(--x) var(--y),
        rgba(124,58,237,.4),
        transparent 60%);
    opacity:0;
    transition:.2s;
}

.card:hover::before{
    opacity:1;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card-content{
    padding:1rem;
}

.btn{
    display:inline-block;
    margin-top:.5rem;
    padding:.5rem 1rem;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    border-radius:8px;
    color:white;
    text-decoration:none;
}

/* ===== SCROLL ===== */
.hidden{
    opacity:0;
    transform:translateY(40px);
    transition:all .7s;
}

.show{
    opacity:1;
    transform:translateY(0);
}
</style>
</head>

<body>

<div class="cursor"></div>
<canvas id="particles"></canvas>

<section class="portada hidden">
    <h1 class="titulo">Electrónica con Arduino</h1>
</section>

<section class="grid">

<div class="card hidden">
<img src="https://images.unsplash.com/photo-1553406830-ef2513450d76">
<div class="card-content">
<h3>Conceptos Básicos</h3>
<a href="#" class="btn">Entrar</a>
</div>
</div>

<div class="card hidden">
<img src="https://images.unsplash.com/photo-1581092160562-40aa08e78837">
<div class="card-content">
<h3>Materiales</h3>
<a href="#" class="btn">Entrar</a>
</div>
</div>

</section>

<script>
/* ===== CURSOR ===== */
const cursor = document.querySelector(".cursor");
document.addEventListener("mousemove", e=>{
    cursor.style.top = e.clientY+"px";
    cursor.style.left = e.clientX+"px";
});

/* ===== PARTICULAS ===== */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<80;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        vx:Math.random()*1-0.5,
        vy:Math.random()*1-0.5
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
        p.x+=p.vx;
        p.y+=p.vy;

        ctx.fillStyle="#7c3aed";
        ctx.fillRect(p.x,p.y,2,2);

        if(p.x<0||p.x>canvas.width) p.vx*=-1;
        if(p.y<0||p.y>canvas.height) p.vy*=-1;
    });
    requestAnimationFrame(animate);
}
animate();

/* ===== SCROLL ===== */
const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }
    });
});
document.querySelectorAll(".hidden").forEach(el=>observer.observe(el));

/* ===== CARD INTERACTIVA ===== */
document.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("mousemove",e=>{
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        card.style.setProperty("--x", x+"px");
        card.style.setProperty("--y", y+"px");

        const rotateX = (y - rect.height/2)/15;
        const rotateY = (rect.width/2 - x)/15;

        card.style.transform =
            `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
    });

    card.addEventListener("mouseleave",()=>{
        card.style.transform="rotateX(0) rotateY(0)";
    });
});
</script>

</body>
</html>
