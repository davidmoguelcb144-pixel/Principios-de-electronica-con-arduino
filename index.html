<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electrónica con Arduino</title>

<style>
:root {
    --vino: #2b0d14;
    --vino-claro: #4a1c24;
    --dorado: #d4af37;
    --blanco: #ffffff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--vino);
    color: var(--blanco);
}

/* PORTADA */
.portada {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #3a121b, #1a0509);
    text-align: center;
}

.titulo-principal {
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--blanco);
    text-shadow: 0 0 20px rgba(212,175,55,0.5);
    animation: glow 3s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px rgba(212,175,55,0.3); }
    to { text-shadow: 0 0 30px rgba(212,175,55,0.8); }
}

.equipo {
    margin-top: 2rem;
}

.miembro {
    margin: 10px 0;
    padding: 10px 20px;
    border-left: 3px solid var(--dorado);
    background: rgba(255,255,255,0.05);
    transition: 0.3s;
}

.miembro:hover {
    transform: translateX(10px);
    background: rgba(212,175,55,0.1);
}

/* CATÁLOGO */
.catalogo {
    padding: 4rem 2rem;
}

.catalogo-titulo {
    text-align: center;
    font-size: 2.5rem;
    margin-bottom: 3rem;
    color: var(--dorado);
}

/* CARDS */
.cards-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2rem;
}

.card {
    background: #1a0509;
    border: 1px solid rgba(212,175,55,0.2);
    border-radius: 15px;
    overflow: hidden;
    transition: 0.4s;
    position: relative;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 0 25px rgba(212,175,55,0.3);
}

/* IMAGEN COMPLETA */
.card-image {
    width: 100%;
    height: 200px;
    object-fit: contain;
    background: black;
}

/* CONTENIDO */
.card-content {
    padding: 1rem;
}

.card-title {
    font-size: 1.2rem;
    margin-bottom: 10px;
    color: var(--blanco);
}

/* BOTÓN */
.card a {
    display: inline-block;
    padding: 8px 15px;
    border: 1px solid var(--dorado);
    color: var(--dorado);
    text-decoration: none;
    transition: 0.3s;
}

.card a:hover {
    background: var(--dorado);
    color: black;
}

/* NUMERO */
.card-number {
    position: absolute;
    top: 10px;
    right: 10px;
    color: var(--dorado);
    font-weight: bold;
}

</style>
</head>

<body>

<section class="portada">
    <h1 class="titulo-principal">Electrónica con Arduino</h1>

    <div class="equipo">
        <div class="miembro">David Yael Gutiérrez</div>
        <div class="miembro">Alde Elishua Ruiz</div>
        <div class="miembro">Valeria Michell Velasco</div>
        <div class="miembro">Ervin Alexander Gonzales</div>
    </div>
</section>

<section class="catalogo">
    <h2 class="catalogo-titulo">Catálogo</h2>

    <div class="cards-container">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1553406830-ef2513450d76" class="card-image">
            <div class="card-content">
                <div class="card-number">1</div>
                <h3 class="card-title">Conceptos Básicos</h3>
                <a href="#">Ver</a>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1581092160562-40aa08e78837" class="card-image">
            <div class="card-content">
                <div class="card-number">2</div>
                <h3 class="card-title">Materiales</h3>
                <a href="#">Ver</a>
            </div>
        </div>

    </div>
</section>

</body>
</html>
